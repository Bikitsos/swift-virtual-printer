name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Manual runs only build (to test the pipeline); publishing happens for tags.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Check tag matches __version__
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = uv run python scripts/bump_version.py
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match __version__ $version"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe and installer
        shell: cmd
        run: call build.bat

      - name: Check build output
        shell: pwsh
        run: |
          $v = uv run python scripts/bump_version.py
          foreach ($f in "dist/SwiftVirtualPrinter/SwiftVirtualPrinter.exe", "dist/SwiftVirtualPrinter-$v-portable.zip", "dist/SwiftVirtualPrinter-Setup-$v.exe") {
            if (-not (Test-Path $f)) { throw "Missing $f" }
          }

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Swift Virtual Printer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SwiftVirtualPrinter-*-portable.zip
            dist/SwiftVirtualPrinter-Setup-*.exe
